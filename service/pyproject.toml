[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-knight-ng-service"
version = "0.1.0"
description = "Private bounded Unix-socket service for Poker Knight NG"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "h11 @ https://files.pythonhosted.org/packages/04/4b/29cac41a4d98d144bf5f6d33995617b185d14b22401f75ca86f384e87ff1/h11-0.16.0-py3-none-any.whl",
    "poker-knight-ng==0.1.0",
]

[tool.uv.sources]
poker-knight-ng = { path = "..", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-timeout>=2.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# CI safety net: any test that hangs fails after 60s (with stack dump) instead
# of stalling the job into the workflow-level 20-minute timeout.
timeout = 60
timeout_method = "thread"

[project.scripts]
poker-knight-ng-service = "poker_knight_ng_service.__main__:main"
