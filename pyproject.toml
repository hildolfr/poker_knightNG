[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-knight-ng"
version = "0.1.0"
description = "Contract-first Texas Hold'em equity engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{name = "Hildolfr"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.13"]
dependencies = []

[project.optional-dependencies]
gpu-cu13 = ["cupy-cuda13x==14.1.1"]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "jsonschema>=4.23,<5",
    "pytest>=8.3",
    "treys==0.1.8",
]

[project.urls]
Homepage = "https://github.com/hildolfr/poker_knightNG"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poker_knight_ng = ["README.md", "cuda-sources/*.cu", "cuda-sources/*.cuh", "schemas/v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
